import: # Import other files from paths relative to this file
  - "model_config/techs.yaml"
  - "model_config/locations.yaml"

scenarios:
  grid_only:
    - existing_case
  without_transformer: 
    - no_upgrade
  with_transformer:
    - force_upgrade

overrides:

  force_upgrade:
    techs:
      supply_grid_upgrade:
        purchased_units_min: 1  # forces the optimizer to always buy the upgrade

  no_upgrade:
    techs:
      supply_grid_upgrade:
        purchased_units_max: 0  # forbids the upgrade entirely
      pv:
        export_max: 165 #Units: kW

  existing_case:
    techs:
      pv:
        flow_cap_max: 0
      battery:
        flow_cap_max: 0
        storage_cap_max: 0
      supply_grid_upgrade:
        purchased_units_max: 0  # forbids the upgrade entirely

config:
  init:
    name: "calliope_thesis_model" # Name of the model
    calliope_version: 0.7.0 # What version of Calliope this model is intended for
    subset:
      timesteps: ["2015-01-01", "2015-12-31"] # Subset of timesteps
    mode: base # Choices: base, operate, spores
    extra_math: ["milp"]  # enables MILP (needed for one time purchase optimization)

  build:
    ensure_feasibility: true # Switching on unmet demand
    backend: gurobi
  solve:
    solver: gurobi
    solver_io: python

data_definitions:
  objective_cost_weights:
    data: 1 #Weight = 1 means: objective = monetary cost
    index: monetary
    dims: costs

  #This is a very large number used to penalize unmet demand. So the solver will almost never allow unmet demand, unless absolutely necessary.
  bigM: 1e6

  cost_interest_rate:
    data: 0.05
    index: monetary
    dims: costs

data_tables:
  demand:
    #Includes both normal demand and EV demand
    data: data_tables/final_hourly_demand.csv #units = kW
    rows: timesteps
    add_dims:
      parameters: sink_use_equals

  pv_resource:
    #Source: Renewables.Ninja
    #Parameters Used:
    #Lat: 49.3356
    #Long: 8.2199
    #Dataset: CM-SAF SARAH (Europe)
    #Capacity(kW): 1
    #System Loss (fraction): 0.1
    #Tracking: None
    #Tilt: 35 degrees
    #Azimuth: 180
    #Units: kW per kW peak (capacity factor)
    #Timestep format needs to be 'yyyy-mm-dd hh:mm:ss'
    data: data_tables/pv_resource_notracking.csv
    rows: timesteps
    add_dims:
      parameters: source_use_max
      techs: pv
