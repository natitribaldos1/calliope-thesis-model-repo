techs:
  pv:
    name: "Solar photovoltaic power rooftop"
    color: "#F9D956"
    base_tech: supply
    carrier_out: electricity
    source_unit: per_cap

    #Assumed area per kWp
    area_use_per_flow_cap: 7 #Units = m²/kWp

    #Set to 1 because the pv_resource data already accounts for system losses.
    flow_out_parasitic_eff: 1

    #Max PV build allowed (to avoid stricter laws)
    flow_cap_max: 999 #Units: kWp

    #Roofspace area
    area_use_max: 7627 #Units: m²

    #PV lifetime
    lifetime: 25 #Units: years

    #Rooftop PV CAPEX
    cost_flow_cap:
      data: 700 #Units: €/kWp
      index: monetary
      dims: costs

    #This means electricity from PV can be exported.
    carrier_export: electricity

    #Grid connection limit
    export_max: 1200 #Units: kW
    #This should automatically be restricted by flow_cap_max from supply_grid_power if transformer upgrade is not built.  

    #Feed-in tarriff
    cost_export:
      data: 0.059 #Units: €/kWh
      index: monetary
      dims: costs

  supply_grid_power:
    name: "National grid import"
    color: "#C5ABE3"
    base_tech: supply
    carrier_out: electricity

    #Unlimited energy can be drawn from the grid
    source_use_max: .inf

    #Grid connection limit
    flow_cap_max: 165 #kW

    #lifetime: 25 #not needed because grid is existing infrastructure
    #cost_flow_cap: #commented out because we assume all demand is already met with existing infrastructure
    #data: 15
    #index: monetary
    #dims: costs

    #Grid electricity price
    cost_flow_in:
      data: 0.32 #Units: €/kWh
      index: monetary
      dims: costs
  
  supply_grid_upgrade:
    name: "Grid connection upgrade (additional capacity)"
    base_tech: supply
    carrier_out: electricity
    source_use_max: .inf
    cap_method: integer
    purchased_units_max: 1
    flow_cap_per_unit: 1035   # 1200 - 165 = 1035 kW extra
    cost_flow_in:
      data: 0.32
      index: monetary
      dims: costs
    cost_purchase:
      data: 210000             # total upgrade cost in €
      index: monetary
      dims: costs
    lifetime: 25              # years — from Frank et al.(2025)
    cost_interest_rate:
      data: 0.05              # 5% discount rate
      index: monetary
      dims: costs

  demand_electricity:
    name: "Electrical demand"
    color: "#072486"
    base_tech: demand
    carrier_in: electricity

  battery:
    name: "Battery storage"
    color: "#3B61E3"
    base_tech: storage
    carrier_in: electricity
    carrier_out: electricity

    flow_cap_max: .inf
    storage_cap_max: .inf

    #flow_cap_per_storage_cap_max: 4

    #Battery discharge efficiency
    flow_out_eff: 0.95

    #Battery charge efficiency
    flow_in_eff: 0.95

    #Battery standing losses
    storage_loss: 0.01 #Units: fraction lost per hour

    #Battery lifetiem
    lifetime: 20 #Units: years

    #Battery power cost (25% of total battery cost)
    cost_flow_cap:
      data: 160 #Units: €/kW
      index: monetary
      dims: costs

    #Battery energy cost (75% of total battery cost)
    cost_storage_cap:
      data: 230 #Units: €/kWh
      index: monetary
      dims: costs
